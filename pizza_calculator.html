<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheDropInn Pizza Lab</title>
    <meta name="description" content="The Drop Inn Pizza Dough Lab - Precision pizza dough scaling engine, dynamic flour protein absorption compensation, thermal baking mass calibration, and step-by-step fermentation timelines.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- html2canvas for recipe snapshot image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Modular CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/print.css">
</head>
<body>

<div class="app-container">
    <!-- Chicago Pizza Box Header Theme -->
    <header class="chicago-box-header">
        <div class="chicago-box-inner">
            <div class="stars">✶ ✶ ✶ ✶</div>
            <div class="brand">The Drop Inn</div>
            <div class="delicious">Pizza Dough Lab</div>
            <div class="stars">✶ ✶ ✶ ✶</div>
        </div>
    </header>

    <!-- Main Two-Column Layout -->
    <div class="layout-grid">
        <!-- Sidebar Controls Panel -->
        <aside class="card-panel controls-panel">
            <div class="panel-header">
                <h2 class="panel-title">⚙️ Calculator Parameters</h2>
                <span class="panel-badge">Config</span>
            </div>

            <!-- Pizza Style Selector Dropdown (All 5 Styles) -->
            <div class="form-group">
                <label for="pizzaStyle">Pizza Style Target</label>
                <select id="pizzaStyle" class="select-control">
                    <option value="neapolitan" selected>Neapolitan</option>
                    <option value="tavern">Chicago Tavern Style</option>
                    <option value="detroit">Detroit-Style</option>
                    <option value="ny">New York Style</option>
                    <option value="focaccia">Focaccia</option>
                </select>
            </div>

            <!-- Flour Inventory Box -->
            <div class="form-group">
                <label>Flour Inventory (Select all available flours)</label>
                <div class="inventory-box" id="inventoryContainer">
                    <!-- Populated dynamically via inventoryModal.js -->
                </div>
            </div>

            <!-- Oven Configuration -->
            <div class="form-group">
                <label for="ovenType">Oven Setup</label>
                <select id="ovenType" class="select-control">
                    <option value="pizza">High-Heat Pizza Oven (Gozney/Ooni)</option>
                    <option value="home">Home Oven (Standard Bake)</option>
                    <option value="convection">Home Oven (Convection/Fan)</option>
                </select>
            </div>

            <!-- Dependent Temperature & Thermal Mass -->
            <div class="form-row-2">
                <div class="form-group">
                    <label for="maxTemp">Max Oven Temp</label>
                    <select id="maxTemp" class="select-control"></select>
                </div>
                <div class="form-group">
                    <label for="stoneType">Stone / Thermal Mass</label>
                    <select id="stoneType" class="select-control"></select>
                </div>
            </div>

            <!-- Yeast & Altitude -->
            <div class="form-row-2">
                <div class="form-group">
                    <label for="yeastType">Yeast Variant</label>
                    <select id="yeastType" class="select-control">
                        <option value="ADY" selected>Active Dry (ADY)</option>
                        <option value="IDY">Instant Dry (IDY)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="altitude">Altitude Profile</label>
                    <select id="altitude" class="select-control">
                        <option value="high" selected>High Altitude (6,300+ ft)</option>
                        <option value="sea">Sea Level</option>
                    </select>
                </div>
            </div>

            <!-- Optional Pre-Ferment (Poolish / Biga for Neapolitan & NY) -->
            <div id="prefermentContainer" class="form-group" style="display: none;">
                <label for="prefermentType">Dough Method / Pre-Ferment</label>
                <div class="form-row-2">
                    <select id="prefermentType" class="select-control">
                        <option value="none" selected>Direct Dough (Standard)</option>
                        <option value="poolish">Poolish (100% Hydration)</option>
                        <option value="biga">Biga (50% Hydration)</option>
                    </select>
                    <select id="prefermentPct" class="select-control" style="display: none;">
                        <option value="20" selected>20% of Flour</option>
                        <option value="30">30% of Flour</option>
                        <option value="40">40% of Flour</option>
                        <option value="50">50% of Flour</option>
                    </select>
                </div>
            </div>

            <!-- Standard Fermentation Dates (Neapolitan, Tavern, NY) -->
            <div id="standardDateInputs" class="form-row-2">
                <div class="form-group">
                    <label for="startDate">Dough Start Date</label>
                    <select id="startDate" class="select-control"></select>
                </div>
                <div class="form-group">
                    <label for="cookingDate">Bake Date</label>
                    <select id="cookingDate" class="select-control"></select>
                </div>
            </div>

            <!-- Detroit & Focaccia Same-Day Hourly Schedule -->
            <div id="detroitTimeInputs" class="form-row-2" style="display: none;">
                <div class="form-group">
                    <label for="detroitStartTime">Earliest Available Start Time</label>
                    <select id="detroitStartTime" class="select-control"></select>
                </div>
                <div class="form-group">
                    <label for="detroitBakeTime">Target Bake Time</label>
                    <select id="detroitBakeTime" class="select-control"></select>
                </div>
            </div>

            <!-- Pizza Dimensions & Quantity -->
            <div class="form-row-2">
                <div class="form-group">
                    <label for="diameter">Target Diameter / Pan Size</label>
                    <select id="diameter" class="select-control"></select>
                </div>
                <div class="form-group">
                    <label for="ballCount">Pizza / Pan Quantity</label>
                    <input type="number" id="ballCount" class="input-control" value="3" min="1" max="50">
                </div>
            </div>
        </aside>

        <!-- Right Main Output Dashboard -->
        <main class="card-panel output-panel" id="outputPanel">
            <!-- Tabs Navigation -->
            <nav class="tabs-navigation">
                <button type="button" class="tab-btn tab-active" data-tab-target="formula" id="tabBtnFormula">
                    <span>⚖️</span> Formula Breakdown
                </button>
                <button type="button" class="tab-btn" data-tab-target="timeline" id="tabBtnTimeline">
                    <span>🗓️</span> Method Timeline
                </button>
                <button type="button" class="tab-btn" data-tab-target="toppings" id="tabBtnToppings">
                    <span>🧀</span> Toppings &amp; Sauces
                </button>
            </nav>

            <!-- Tab 1: Formula Breakdown -->
            <section id="tab-formula" class="tab-content-panel panel-active">
                <div id="formulaViewContainer">
                    <!-- Populated dynamically via formulaView.js -->
                </div>
            </section>

            <!-- Tab 2: Method Timeline -->
            <section id="tab-timeline" class="tab-content-panel">
                <div id="timelineViewContainer">
                    <!-- Populated dynamically via timelineView.js -->
                </div>
            </section>

            <!-- Tab 3: Toppings & Sauces -->
            <section id="tab-toppings" class="tab-content-panel">
                <div id="toppingsViewContainer">
                    <!-- Populated dynamically via toppingsView.js -->
                </div>
            </section>

            <!-- Kitchen Action Toolbar -->
            <footer class="kitchen-toolbar">
                <button type="button" class="btn-action btn-primary-action" id="btnDownloadImage">
                    <span>📸</span> Save Recipe as Image
                </button>
                <button type="button" class="btn-action btn-secondary-action" id="btnCopyRecipe">
                    <span>📋</span> Copy Formula Summary
                </button>
                <button type="button" class="btn-action btn-secondary-action" id="btnPrintSheet">
                    <span>🖨️</span> Print Kitchen Sheet
                </button>
                <button type="button" class="btn-action btn-secondary-action" id="btnResetApp">
                    <span>↺</span> Reset Defaults
                </button>
            </footer>
        </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Intelligent Pizza Dough Calculator &bull; Architectural Refactor &bull; Modular ES Vanilla Architecture</p>
    </footer>
</div>

<!-- Modal Dialog: Add Custom Flour -->
<div id="addFlourModal" class="modal-overlay">
    <div class="modal-dialog">
        <div class="modal-header">
            <h3 class="modal-title">➕ Add Custom Flour</h3>
            <button type="button" class="modal-close-btn">&times;</button>
        </div>
        <form id="addFlourForm">
            <div class="modal-body">
                <div class="form-group">
                    <label for="flourBrand">Brand / Mill</label>
                    <input type="text" id="flourBrand" name="flourBrand" class="input-control" placeholder="e.g. Caputo, Bay State Milling" required>
                </div>
                <div class="form-group">
                    <label for="flourName">Flour Name</label>
                    <input type="text" id="flourName" name="flourName" class="input-control" placeholder="e.g. Rinforzato, Sir Galahad" required>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="flourProtein">Protein (%)</label>
                        <input type="number" id="flourProtein" name="flourProtein" class="input-control" step="0.1" min="8" max="20" placeholder="12.5" required>
                    </div>
                    <div class="form-group">
                        <label for="flourAsh">Ash Content (%)</label>
                        <input type="number" id="flourAsh" name="flourAsh" class="input-control" step="0.01" min="0.3" max="2.0" placeholder="0.55">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="flourW">W Strength Index (Optional)</label>
                        <input type="number" id="flourW" name="flourW" class="input-control" step="5" min="0" max="500" placeholder="280">
                    </div>
                    <div class="form-group" style="display: flex; flex-direction: column; justify-content: center;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 18px;">
                            <input type="checkbox" id="flourMalted" name="flourMalted" style="width: 18px; height: 18px; accent-color: var(--brand-primary);">
                            <span>Malted Barley Added</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="flourNotes">Notes / Milling Details</label>
                    <input type="text" id="flourNotes" name="flourNotes" class="input-control" placeholder="e.g. Unbleached winter wheat, high extensibility">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-action btn-secondary-action" id="btnCancelAddFlour">Cancel</button>
                <button type="submit" class="btn-action btn-primary-action">Save to Inventory</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast Popup Notification -->
<div id="toastNotification" class="toast-popup"></div>

<!-- Modular Architecture Scripts (Loaded in dependency order) -->
<script src="js/data/flours.js"></script>
<script src="js/data/recipes.js"></script>
<script src="js/data/equipment.js"></script>
<script src="js/engine/calculator.js"></script>
<script src="js/engine/flourMatcher.js"></script>
<script src="js/engine/timelineEngine.js"></script>
<script src="js/state/store.js"></script>
<script src="js/ui/formulaView.js"></script>
<script src="js/ui/toppingsView.js"></script>
<script src="js/ui/timelineView.js"></script>
<script src="js/ui/inventoryModal.js"></script>
<script src="js/app.js"></script>

</body>
</html>
